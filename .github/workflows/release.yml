# GitHub Release 工作流
# 用途：当推送 `v*` tag 时构建 release 版本产物。
# 使用方式：
# 1. 创建并推送 tag，例如 `git tag v0.1.0 && git push origin v0.1.0`
# 2. GitHub Actions 会自动运行本流程

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    # Release 构建作业。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release artifacts
        run: cargo build --workspace --release
