# GitHub Release 工作流
# 用途：当推送 `v*` 或 `release-*` tag 时构建多平台 release 产物并上传到 GitHub Release。
# 使用方式：
# 1. 创建并推送 tag，例如 `git tag v0.1.0 && git push origin v0.1.0`
# 2. GitHub Actions 会自动构建 tarball、checksum 和汇总 release

name: Release

on:
  push:
    tags:
      - "v*"
      - "release-*"

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: meat-memory-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: meat-memory-linux-arm64
          - runner: macos-14
            target: x86_64-apple-darwin
            asset_name: meat-memory-darwin-amd64
          - runner: macos-14
            target: aarch64-apple-darwin
            asset_name: meat-memory-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p memory-cli \
            -p memory-app \
            -p memory-worker

      - name: Package release archive
        run: |
          chmod +x ./docs/scripts/build-release-artifacts.sh
          ./docs/scripts/build-release-artifacts.sh \
            --target "${{ matrix.target }}" \
            --asset-name "${{ matrix.asset_name }}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/release/${{ matrix.asset_name }}.tar.gz
            dist/release/${{ matrix.asset_name }}.tar.gz.sha256

      - name: Publish packaged asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/${{ matrix.asset_name }}.tar.gz
            dist/release/${{ matrix.asset_name }}.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/github-release

      - name: Flatten artifact tree
        run: |
          mkdir -p dist/github-release-flat
          find dist/github-release -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} dist/github-release-flat/ \;

      - name: Build agent skills bundle
        run: |
          chmod +x ./docs/scripts/export-agent-skills.sh
          chmod +x ./docs/scripts/build-agent-skills-bundle.sh
          ./docs/scripts/build-agent-skills-bundle.sh all dist/github-release-flat

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/github-release-flat/*

  publish-docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app image metadata
        id: app_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meat-memory-app
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Extract worker image metadata
        id: worker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meat-memory-worker
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app-runtime
          push: true
          build-args: |
            MEAT_MEMORY_VERSION=${{ github.ref_name }}
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker-runtime
          push: true
          build-args: |
            MEAT_MEMORY_VERSION=${{ github.ref_name }}
          tags: ${{ steps.worker_meta.outputs.tags }}
          labels: ${{ steps.worker_meta.outputs.labels }}
