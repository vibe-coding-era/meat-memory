apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meat-memory.fullname" . }}-secrets
  labels:
    {{- include "meat-memory.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  QWEN_API_KEY: {{ .Values.secrets.qwenApiKey | quote }}
  DOUBAO_API_KEY: {{ .Values.secrets.doubaoApiKey | quote }}
  MINIMAX_API_KEY: {{ .Values.secrets.minimaxApiKey | quote }}
  GLM_API_KEY: {{ .Values.secrets.glmApiKey | quote }}
