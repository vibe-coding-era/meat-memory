# Meat Memory 本地覆盖配置示例
# 用途：在默认配置基础上做开发期覆盖，不直接提交真实本地私有配置。
# 使用方式：
# 1. 复制：`cp config/local.example.toml config/local.toml`
# 2. 按需修改日志级别、数据库地址、MCP 开关
# 3. 启动前指定：`export MEAT_MEMORY_CONFIG=config/local.toml`

# 本地调试时建议开 debug，方便看请求与路由链路。
[logging]
level = "debug"

# 指向本地开发库。
[postgres]
database_url = "postgres://postgres:postgres@127.0.0.1:5433/meat_memory_dev"

# 本地通常同时打开 HTTP 和 MCP，便于联调。
[features]
enable_http = true
enable_mcp = true
