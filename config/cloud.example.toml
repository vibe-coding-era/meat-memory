# Meat Memory 云端部署配置示例
# 用途：给云主机 / 容器 / Kubernetes 部署提供参考配置。
# 使用方式：
# 1. 复制为实际部署文件，例如 `config/cloud.toml`
# 2. 替换数据库地址、挂载目录、模型 API Key 环境变量
# 3. 启动时设置 `MEAT_MEMORY_CONFIG=/app/config/cloud.toml`

# 云环境默认监听全部网卡，便于被网关或 Ingress 访问。
[server]
bind = "0.0.0.0:8080"
shutdown_grace_period_secs = 10

# 云端日志建议使用 JSON，便于接入集中日志系统。
[logging]
level = "info"
format = "json"

# 云端 Markdown 和资产目录建议挂到持久卷。
[markdown]
root = "/data/markdown"

[postgres]
app_name = "meat-memory"
database_url = "postgres://postgres:postgres@postgresql:5432/meat_memory"

[assets]
root = "/data/assets"

[models]
default_locale = "zh-CN"

[[models.providers]]
provider = "openai"
display_name = "ChatGPT / OpenAI"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
enabled = true

[[models.providers]]
provider = "anthropic"
display_name = "Claude / Anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
enabled = true

[[models.providers]]
provider = "gemini"
display_name = "Gemini / Google"
base_url = "https://generativelanguage.googleapis.com"
api_key_env = "GEMINI_API_KEY"
enabled = true

[[models.providers]]
provider = "qwen"
display_name = "Qwen / Tongyi"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "QWEN_API_KEY"
enabled = true

[[models.providers]]
provider = "doubao"
display_name = "Doubao / Volcano Engine"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key_env = "DOUBAO_API_KEY"
enabled = true

[[models.providers]]
provider = "minimax"
display_name = "MiniMax"
base_url = "https://api.minimax.chat/v1"
api_key_env = "MINIMAX_API_KEY"
enabled = true

[[models.providers]]
provider = "glm"
display_name = "GLM / Zhipu"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "GLM_API_KEY"
enabled = true

[[models.catalog]]
alias = "chatgpt_reasoning"
provider = "openai"
remote_model_id = "gpt-5-mini"
display_name = "ChatGPT Reasoning"
capabilities = ["reasoning", "extraction"]
deployment = "cloud"
locale = "zh-CN"
priority = 100
enabled = true

[[models.catalog]]
alias = "chatgpt_vision"
provider = "openai"
remote_model_id = "gpt-4.1-mini"
display_name = "ChatGPT Vision"
capabilities = ["vision"]
deployment = "cloud"
locale = "zh-CN"
priority = 90
enabled = true

[[models.catalog]]
alias = "chatgpt_embedding"
provider = "openai"
remote_model_id = "text-embedding-3-large"
display_name = "ChatGPT Embedding"
capabilities = ["embedding"]
deployment = "cloud"
locale = "zh-CN"
priority = 90
enabled = true

[[models.catalog]]
alias = "claude_reasoning"
provider = "anthropic"
remote_model_id = "claude-sonnet-4-5"
display_name = "Claude Reasoning"
capabilities = ["reasoning", "extraction"]
deployment = "cloud"
locale = "zh-CN"
priority = 95
enabled = true

[[models.catalog]]
alias = "claude_vision"
provider = "anthropic"
remote_model_id = "claude-sonnet-4-5"
display_name = "Claude Vision"
capabilities = ["vision"]
deployment = "cloud"
locale = "zh-CN"
priority = 85
enabled = true

[[models.catalog]]
alias = "gemini_vision"
provider = "gemini"
remote_model_id = "gemini-2.5-flash"
display_name = "Gemini Multimodal"
capabilities = ["reasoning", "extraction", "vision"]
deployment = "cloud"
locale = "zh-CN"
priority = 92
enabled = true

[[models.catalog]]
alias = "qwen_reasoning"
provider = "qwen"
remote_model_id = "qwen-max"
display_name = "Qwen Reasoning"
capabilities = ["reasoning", "extraction"]
deployment = "cloud"
locale = "zh-CN"
priority = 88
enabled = true

[[models.catalog]]
alias = "qwen_embedding"
provider = "qwen"
remote_model_id = "text-embedding-v4"
display_name = "Qwen Embedding"
capabilities = ["embedding"]
deployment = "cloud"
locale = "zh-CN"
priority = 95
enabled = true

[[models.catalog]]
alias = "doubao_reasoning"
provider = "doubao"
remote_model_id = "doubao-seed-1-6"
display_name = "Doubao Reasoning"
capabilities = ["reasoning", "extraction"]
deployment = "cloud"
locale = "zh-CN"
priority = 80
enabled = true

[[models.catalog]]
alias = "minimax_reasoning"
provider = "minimax"
remote_model_id = "MiniMax-M1"
display_name = "MiniMax Reasoning"
capabilities = ["reasoning", "extraction"]
deployment = "cloud"
locale = "zh-CN"
priority = 78
enabled = true

[[models.catalog]]
alias = "glm_reasoning"
provider = "glm"
remote_model_id = "glm-4.5"
display_name = "GLM Reasoning"
capabilities = ["reasoning", "extraction"]
deployment = "cloud"
locale = "zh-CN"
priority = 86
enabled = true

[[models.catalog]]
alias = "glm_embedding"
provider = "glm"
remote_model_id = "embedding-3"
display_name = "GLM Embedding"
capabilities = ["embedding"]
deployment = "cloud"
locale = "zh-CN"
priority = 82
enabled = true

[models.routing.reasoning]
primary = "chatgpt_reasoning"
fallbacks = ["claude_reasoning", "gemini_vision", "qwen_reasoning", "glm_reasoning"]

[models.routing.extraction]
primary = "qwen_reasoning"
fallbacks = ["claude_reasoning", "chatgpt_reasoning", "glm_reasoning"]

[models.routing.vision]
primary = "gemini_vision"
fallbacks = ["chatgpt_vision", "claude_vision"]

[models.routing.embedding]
primary = "qwen_embedding"
fallbacks = ["chatgpt_embedding", "glm_embedding"]

# 同步模式：当前示例仍采用 dual_write。
[sync]
mode = "dual_write"

# 云环境通常同时启用 HTTP 与 MCP。
[features]
enable_pg = true
enable_markdown = true
enable_http = true
enable_mcp = true
