services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: meat-memory-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meat-memory-app
    environment:
      MEAT_MEMORY_CONFIG: /app/config/docker.toml
    depends_on:
      pgvector:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - memory-docs:/app/docs
      - memory-assets:/app/storage/assets
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meat-memory-worker
    command: ["memory-worker"]
    environment:
      MEAT_MEMORY_CONFIG: /app/config/docker.toml
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - memory-docs:/app/docs
      - memory-assets:/app/storage/assets
    restart: unless-stopped

volumes:
  pgvector-data:
  memory-docs:
  memory-assets:
