# Meat Memory 本地 Docker Compose 编排
# 用途：一键启动 PostgreSQL(pgvector) + app + worker。
# 使用方式：
# 1. 准备环境变量：`cp .env.example .env`
# 2. 启动：`docker compose up -d`
# 3. 查看状态：`docker compose ps`
# 4. 停止：`docker compose down`

services:
  pgvector:
    # 本地开发数据库，内置 pgvector 扩展镜像。
    image: pgvector/pgvector:pg17
    container_name: meat-memory-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    # 对外提供 HTTP / Browser Console / MCP 的主服务。
    image: ${MEAT_MEMORY_APP_IMAGE:-meat-memory-app}:${MEAT_MEMORY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: app-runtime
      args:
        MEAT_MEMORY_VERSION: ${MEAT_MEMORY_IMAGE_TAG:-local}
    container_name: meat-memory-app
    environment:
      MEAT_MEMORY_CONFIG: /app/config/app.toml
      MEAT_MEMORY_SERVER_BIND: 0.0.0.0:8080
      MEAT_MEMORY_DATABASE_URL: postgres://postgres:postgres@pgvector:5432/meat_memory_dev
      MEAT_MEMORY_MARKDOWN_ROOT: /app/docs
      MEAT_MEMORY_ASSETS_ROOT: /app/storage/assets
      MEAT_MEMORY_ENABLE_MCP: "true"
    depends_on:
      pgvector:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - memory-docs:/app/docs
      - memory-assets:/app/storage/assets
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    # 后台工作进程，和 app 共用同一份运行配置。
    image: ${MEAT_MEMORY_WORKER_IMAGE:-meat-memory-worker}:${MEAT_MEMORY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runtime
      args:
        MEAT_MEMORY_VERSION: ${MEAT_MEMORY_IMAGE_TAG:-local}
    container_name: meat-memory-worker
    environment:
      MEAT_MEMORY_CONFIG: /app/config/app.toml
      MEAT_MEMORY_SERVER_BIND: 0.0.0.0:8080
      MEAT_MEMORY_DATABASE_URL: postgres://postgres:postgres@pgvector:5432/meat_memory_dev
      MEAT_MEMORY_MARKDOWN_ROOT: /app/docs
      MEAT_MEMORY_ASSETS_ROOT: /app/storage/assets
      MEAT_MEMORY_ENABLE_MCP: "true"
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - memory-docs:/app/docs
      - memory-assets:/app/storage/assets
    restart: unless-stopped

volumes:
  # PostgreSQL 数据卷。
  pgvector-data:
  # Markdown Memory 文档卷。
  memory-docs:
  # 图片等资产卷。
  memory-assets:
